<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Evelyn Gutierrez Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav-bar">
    <a class="brand" href="index.html">Evelyn Gutierrez</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="contact" class="contact-section">
      <div class="contact-grid">
        <div class="contact-copy">
          <p class="eyebrow">inquire</p>
          <h2>Let's connect over your next session.</h2>
        </div>

        <div class="contact-card">
          <form class="contact-form" id="inquiryForm" action="https://formsubmit.co/ajax/eviegutierrez@live.com" method="POST">
            <input type="hidden" name="_subject" value="New inquiry from evelyngutierrez.com" />
            <input type="hidden" name="_captcha" value="false" />
            <label>
              Email
              <input type="email" name="email" id="email" placeholder="you@example.com" required />
            </label>

            <div class="radio-group">
              <p>I'm inquiring about</p>
              <label><input type="radio" name="inquiry" value="Regular session – 1 hour" required /> Regular session – 1 hr</label>
              <label><input type="radio" name="inquiry" value="Wedding packages" /> Wedding packages</label>
              <label><input type="radio" name="inquiry" value="Branding" /> Branding</label>
              <label><input type="radio" name="inquiry" value="Travel" /> Travel</label>
            </div>

            <label>
              Notes (optional)
              <textarea name="message" id="message" placeholder="Tell me about your vision..."></textarea>
            </label>

            <div class="form-footer">
              <button type="submit" class="primary-button">Send inquiry</button>
              <p class="help-text">You’ll receive a tailored email with packages once your inquiry is submitted.</p>
              <div id="submitNotice" class="submit-notice" aria-live="polite"></div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">Back to home</a>
  </footer>

  <div id="confirmationModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle">
      <p class="modal-eyebrow">message sent</p>
      <h3 id="confirmationTitle">Your inquiry is on its way. Thank you!</h3>
      <button id="closeModal" class="secondary-button">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
