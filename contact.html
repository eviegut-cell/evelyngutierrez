<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Evelyn Gutierrez Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="nav-bar">
  <a class="brand" href="index.html">Evelyn Gutierrez</a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="siteMenu" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <nav class="site-menu" id="siteMenu" aria-label="Main navigation" hidden>
    <a href="index.html">Home</a>
    <a href="gallery.html">Portfolio</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
</header>
<main>
    <section id="contact" class="contact-section">
      <form class="contact-form" id="inquiryForm" action="https://formsubmit.co/ajax/eviegutierrez@live.com" method="POST">
        <input type="hidden" name="_subject" value="New inquiry from evelyngutierrez.com" />
        <input type="hidden" name="_captcha" value="false" />
        <label>
          Email
          <input type="email" name="email" id="email" placeholder="you@example.com" required />
        </label>

        <label>
          Message
          <textarea name="message" id="message" placeholder="Write your message..." required></textarea>
        </label>

        <div class="form-footer">
          <button type="submit" class="primary-button">Send a note</button>
          <div id="submitNotice" class="submit-notice" aria-live="polite"></div>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">Back to home</a>
  </footer>

  <div id="confirmationModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle">
      <p class="modal-eyebrow">message sent</p>
      <h3 id="confirmationTitle">Your inquiry is on its way. Thank you!</h3>
      <button id="closeModal" class="secondary-button">Close</button>
    </div>
  </div>

  <script src="site-menu.js"></script>
  <script src="script.js"></script>
</body>
</html>
