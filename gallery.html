<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Evelyn Gutierrez Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav-bar">
    <a class="brand" href="index.html">Evelyn Gutierrez</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="gallery-section" style="padding-top:120px;">
      <div class="section-intro">
        <p class="eyebrow">portfolio</p>
      </div>

      <div class="photo-grid" id="photoGrid"></div>

      <script>
        const photos = [
          "./1.jpg",
          "./2.jpg",
          "./3.jpg",
          "./4.jpg",
          "./5.jpg",
          "./6.jpg",
          "./1791808444290.jpg",
          "./533A2230.jpeg",
          "./533A2352.jpg",
          "./533A2362.jpg",
          "./533A2447.jpeg",
          "./533A2451.jpg",
          "./533A2606.jpg",
          "./533A2849.jpg",
          "./533A6844.jpg",
          "./533A7087.jpg",
          "./533A7134.jpeg",
          "./533A7334.jpeg",
          "./533A7433.jpeg",
          "./533A7468.jpeg",
          "./533A7655.jpeg",
          "./533A7699.jpeg",
          "./IMG_0006.jpg",
          "./IMG_0030.jpg",
          "./IMG_0122.jpg",
          "./IMG_0666.jpg",
          "./IMG_0722.jpg",
          "./IMG_0728.jpg",
          "./IMG_2659.jpeg",
          "./IMG_5283.jpeg",
          "./IMG_5886.jpeg",
          "./IMG_5887.jpeg",
          "./IMG_5889.jpeg",
          "./IMG_5890.jpeg",
          "./IMG_5891.jpeg",
          "./IMG_5894.jpeg",
          "./IMG_5898.jpeg"
        ];

        function shuffle(items) {
          const shuffled = [...items];
          for (let i = shuffled.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        }

        document.addEventListener("DOMContentLoaded", () => {
          const grid = document.getElementById("photoGrid");
          const randomizedPhotos = shuffle(photos);

          randomizedPhotos.forEach((src) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "gallery photo";
            img.className = "photo-card";
            grid.appendChild(img);
          });
        });
      </script>
    </section>
  </main>

  <footer class="site-footer">
    <a href="contact.html">Book a session</a>
  </footer>
</body>
</html>
