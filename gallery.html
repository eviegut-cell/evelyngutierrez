<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Evelyn Gutierrez Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav-bar">
    <a class="brand" href="index.html">Evelyn Gutierrez</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="siteMenu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="siteMenu" aria-label="Main navigation" hidden>
      <a href="index.html">Home</a>
      <a href="gallery.html" aria-current="page">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="gallery-section">
      <div class="gallery-tools">
        <button class="reorder-toggle" id="reorderToggle" type="button" aria-pressed="false">Reorder photos</button>
        <div class="order-layout-controls" id="orderLayoutControls" hidden>
          <button class="order-layout-button" type="button" data-layout="mobile" aria-pressed="false">Mobile order</button>
          <button class="order-layout-button" type="button" data-layout="desktop" aria-pressed="false">Desktop order</button>
        </div>
        <button class="copy-photo-order" id="copyPhotoOrder" type="button" hidden>Copy photo order</button>
        <p class="reorder-status" id="reorderStatus" role="status" aria-live="polite"></p>
        <textarea class="photo-order-output" id="photoOrderOutput" aria-label="Updated photo order" readonly hidden></textarea>
      </div>
      <div class="photo-grid" id="photoGrid"></div>

      <script>
        const mobilePhotos = [
          "./photos/IMG_0722.jpg",
          "./photos/533A2451.jpg",
          "./photos/533A7134.jpeg",
          "./photos/IMG_0666.jpg",
          "./photos/533A6844.jpg",
          "./photos/533A7468.jpeg",
          "./photos/533A8606.JPG",
          "./photos/533A8712.JPG",
          "./photos/533A6073.jpg",
          "./photos/533A8309.JPG",
          "./photos/IMG_2014.jpeg",
          "./photos/2.jpg",
          "./photos/4.jpg",
          "./photos/533A2230.jpeg",
          "./photos/533A8109.JPG",
          "./photos/533A7655.jpeg",
          "./photos/533A8356.JPG",
          "./photos/533A2465.jpg",
          "./photos/533A2352.jpg",
          "./photos/533A7699.jpeg",
          "./photos/IMG_0728.jpg",
          "./photos/533A2606.jpg",
          "./photos/IMG_5898.jpeg",
          "./photos/533A8098.JPG",
          "./photos/IMG_2659.jpeg",
          "./photos/IMG_0122.jpg",
          "./photos/IMG_0006.jpg"
        ];

        const desktopPhotos = [
          "./photos/IMG_0722.jpg",
          "./photos/533A2451.jpg",
          "./photos/533A7468.jpeg",
          "./photos/533A6844.jpg",
          "./photos/533A7655.jpeg",
          "./photos/IMG_0666.jpg",
          "./photos/533A8606.JPG",
          "./photos/533A7134.jpeg",
          "./photos/533A6073.jpg",
          "./photos/533A8109.JPG",
          "./photos/533A8712.JPG",
          "./photos/533A2465.jpg",
          "./photos/533A8309.JPG",
          "./photos/4.jpg",
          "./photos/IMG_0728.jpg",
          "./photos/533A2352.jpg",
          "./photos/533A2606.jpg",
          "./photos/533A2230.jpeg",
          "./photos/533A8356.JPG",
          "./photos/533A8098.JPG",
          "./photos/533A7699.jpeg",
          "./photos/2.jpg",
          "./photos/IMG_5898.jpeg",
          "./photos/IMG_2014.jpeg",
          "./photos/IMG_0122.jpg",
          "./photos/IMG_0006.jpg",
          "./photos/IMG_2659.jpeg"
        ];
        const galleryPhotoOrders = { mobile: mobilePhotos, desktop: desktopPhotos };
        const galleryGrid = document.getElementById("photoGrid");

        function renderGalleryPhotos(photos) {
          galleryGrid.replaceChildren();
          photos.forEach((src) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Photograph from Evelyn Gutierrez's portfolio";
            img.className = "photo-card";
            img.loading = "lazy";
            img.decoding = "async";
            galleryGrid.appendChild(img);
          });
        }

        window.galleryPhotoOrders = galleryPhotoOrders;
        window.renderGalleryPhotos = renderGalleryPhotos;

        document.addEventListener("DOMContentLoaded", () => {
          const layout = window.matchMedia("(max-width: 600px)").matches ? "mobile" : "desktop";
          renderGalleryPhotos(galleryPhotoOrders[layout]);
        });
      </script>
    </section>
  </main>

  <footer class="site-footer">
    <a href="contact.html">Book a session</a>
  </footer>
  <script src="site-menu.js"></script>
  <script src="gallery-editor.js"></script>
</body>
</html>
